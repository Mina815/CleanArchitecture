version: '3.8'

services:
  db:
    image: postgres:17
    container_name: jamalek-db
    environment:
      POSTGRES_DB: jamalek
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/Web/Dockerfile
    container_name: jamalek-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__CleanArchitectureDb: "Server=db;Port=5432;Database=jamalek;User Id=postgres;Password=postgres;"
      Jwt__Secret: "ThisIsASecureKeyForJamalekAppChangeInProduction!@#$%"
      Jwt__Issuer: "Jamalek"
      Jwt__Audience: "JamalekApp"
    ports:
      - "5000:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
