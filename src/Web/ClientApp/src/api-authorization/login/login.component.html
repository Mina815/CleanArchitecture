<article>
  <h2>Log in to Jamalek</h2>
  <form (ngSubmit)="login()" #loginForm="ngForm">
    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone" [(ngModel)]="phone"
      [attr.aria-invalid]="invalid ? true : null"
      placeholder="01xxxxxxxxx"
      autocomplete="username"
      (ngModelChange)="invalid = false" />
    <label for="password">Password</label>
    <input type="password" id="password" name="password" [(ngModel)]="password"
      [attr.aria-invalid]="invalid ? true : null"
      autocomplete="current-password"
      (ngModelChange)="invalid = false" />
    @if (invalid) {
      <small>Invalid phone or password.</small>
    }
    <button type="submit">Log in</button>
    <p style="margin-top: 1rem">Don't have an account? <a [routerLink]="['/register']">Register</a></p>
    <details>
      <summary>Demo accounts</summary>
      <ul>
        <li>Customer: 01022222222 / Customer123!</li>
        <li>Provider: 01011111111 / Provider123!</li>
      </ul>
    </details>
  </form>
</article>
